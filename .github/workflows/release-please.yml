name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a rolling "chore(main): release x.y.z" PR built from the
      # conventional commits on main. Merging it bumps package.json, writes
      # CHANGELOG.md, tags vX.Y.Z, and publishes a GitHub Release — which is
      # what triggers publish.yml.
      #
      # GITHUB_TOKEN is deliberate: CI checks will not run on the release PR
      # as a result. That is acceptable because every commit reaching main
      # already passed CI, and the release PR only touches the version and
      # changelog. Swap in a PAT if you ever want checks on it.
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
