name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: node ${{ matrix.node }} / python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is what pi core requires; upper bound is current LTS.
        node: ["22.19", "24"]
        # Lower bound is the oldest interpreter runner.py supports.
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The kernel resolves `python3` from PATH when no override is set,
      # so confirm the matrix leg's interpreter is the one under test.
      - name: Report interpreter
        run: python3 --version

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test
