name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.runtime.name }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The three hosted OS families, all on x64 so Python 3.9 is available
        # (macos-latest is arm64 and has no Python 3.9 build).
        os: [ubuntu-latest, macos-26-intel, windows-latest]
        runtime:
          # Node 22.19 is pi's minimum, 22.x is the current maintenance patch,
          # 24.x is Active LTS, and 26.x is Current.
          - { name: node-22.19, kind: node, version: "22.19" }
          - { name: node-22.x, kind: node, version: "22.x" }
          - { name: node-24.x, kind: node, version: "24.x" }
          - { name: node-26.x, kind: node, version: "26.x" }
          # Semver ranges select the latest patch in each modern Bun line.
          - { name: bun-1.3.x, kind: bun, version: "1.3.x" }
          - { name: bun-1.4.x, kind: bun, version: "1.4.x" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        if: matrix.runtime.kind == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.runtime.version }}
          cache: npm

      # npm and tsc still use Node when Bun is the host under test.
      - name: Set up Node for dependencies
        if: matrix.runtime.kind == 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Set up Bun
        if: matrix.runtime.kind == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.runtime.version }}

      - name: Report JS runtime
        shell: bash
        run: |
          if [ "${{ matrix.runtime.kind }}" = "node" ]; then
            node --version
          else
            bun --version
          fi

      - run: npm ci

      - name: Typecheck
        run: npm run check

      # Keep Python versions as steps rather than a matrix axis: this yields
      # one check per JS runtime/OS pair (18 total), not 108 separate checks.
      # continue-on-error lets every version run; the aggregate step below
      # still fails the job if any one of them failed.
      - id: py39
        name: Python 3.9
        continue-on-error: true
        uses: ./.github/actions/test-python
        with: { python-version: "3.9", runtime-kind: "${{ matrix.runtime.kind }}" }
      - id: py310
        name: Python 3.10
        continue-on-error: true
        uses: ./.github/actions/test-python
        with: { python-version: "3.10", runtime-kind: "${{ matrix.runtime.kind }}" }
      - id: py311
        name: Python 3.11
        continue-on-error: true
        uses: ./.github/actions/test-python
        with: { python-version: "3.11", runtime-kind: "${{ matrix.runtime.kind }}" }
      - id: py312
        name: Python 3.12
        continue-on-error: true
        uses: ./.github/actions/test-python
        with: { python-version: "3.12", runtime-kind: "${{ matrix.runtime.kind }}" }
      - id: py313
        name: Python 3.13
        continue-on-error: true
        uses: ./.github/actions/test-python
        with: { python-version: "3.13", runtime-kind: "${{ matrix.runtime.kind }}" }
      - id: py314
        name: Python 3.14
        continue-on-error: true
        uses: ./.github/actions/test-python
        with: { python-version: "3.14", runtime-kind: "${{ matrix.runtime.kind }}" }

      - name: Require every Python version
        if: always()
        shell: bash
        env:
          PY39: ${{ steps.py39.outcome }}
          PY310: ${{ steps.py310.outcome }}
          PY311: ${{ steps.py311.outcome }}
          PY312: ${{ steps.py312.outcome }}
          PY313: ${{ steps.py313.outcome }}
          PY314: ${{ steps.py314.outcome }}
        run: |
          printf '3.9=%s 3.10=%s 3.11=%s 3.12=%s 3.13=%s 3.14=%s\n' \
            "$PY39" "$PY310" "$PY311" "$PY312" "$PY313" "$PY314"
          test "$PY39 $PY310 $PY311 $PY312 $PY313 $PY314" = \
            "success success success success success success"

  # Branch protection requires this stable context. It turns red unless all
  # 18 runtime/OS jobs (and therefore all 108 combinations) succeeded.
  gate:
    name: CI gate
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Require the full matrix
        env:
          MATRIX_RESULT: ${{ needs.check.result }}
        run: test "$MATRIX_RESULT" = success
