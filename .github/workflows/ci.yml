name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.runtime.name }} / python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Every Python version pi-python claims to support. 3.9 is past
        # upstream EOL, but remains here while it is still our documented floor.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # The three hosted OS families, all on x64 so the full Python range is
        # available (macos-latest is arm64 and has no Python 3.9 build).
        # Signal semantics are part of the test suite.
        os: [ubuntu-latest, macos-26-intel, windows-latest]
        runtime:
          # Node 22.19 is pi's minimum, 22.x is the current maintenance patch,
          # 24.x is Active LTS, and 26.x is Current.
          - { name: node-22.19, kind: node, version: "22.19" }
          - { name: node-22.x, kind: node, version: "22.x" }
          - { name: node-24.x, kind: node, version: "24.x" }
          - { name: node-26.x, kind: node, version: "26.x" }
          # Bun 1.3 and 1.4 are the modern stable lines at authoring time.
          # Semver ranges select the latest patch in each line.
          - { name: bun-1.3.x, kind: bun, version: "1.3.x" }
          - { name: bun-1.4.x, kind: bun, version: "1.4.x" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        if: matrix.runtime.kind == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.runtime.version }}
          cache: npm

      # npm installs and tsc still use a supported Node when Bun is the host
      # under test. The kernel suite itself runs under Bun below.
      - name: Set up Node for dependencies
        if: matrix.runtime.kind == 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Set up Bun
        if: matrix.runtime.kind == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.runtime.version }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Report runtimes
        shell: bash
        run: |
          python --version
          if [ "${{ matrix.runtime.kind }}" = "node" ]; then
            node --version
          else
            bun --version
          fi

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test under Node
        if: matrix.runtime.kind == 'node'
        run: npm test
        env:
          PI_PYTHON_TEST_INTERPRETER: python

      - name: Test under Bun
        if: matrix.runtime.kind == 'bun'
        run: npm run test:bun
        env:
          PI_PYTHON_TEST_INTERPRETER: python

  # Branch protection requires this stable context instead of every dynamic
  # matrix name. It turns red unless the entire 108-job matrix succeeded.
  gate:
    name: CI gate
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Require the full matrix
        env:
          MATRIX_RESULT: ${{ needs.check.result }}
        run: test "$MATRIX_RESULT" = success
